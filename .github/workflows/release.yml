---
name: Release
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    name: test
    runs-on: ubuntu-26.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configure Mise
        uses: jdx/mise-action@v5
        with:
          install: true
          experimental: true
          cache: true
      - name: Install requirements
        run: mise tasks run deps
      - name: Apply locally
        run: ansible-playbook -c local -i localhost, test/playbook.yml
        env:
          ANSIBLE_ROLES_PATH: "${GITHUB_WORKSPACE}/../"
      - name: Run Tests
        run: py.test --sudo ${PWD}/test
  release:
    name: Release
    runs-on: ubuntu-26.04
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configure Mise
        uses: jdx/mise-action@v5
        with:
          install: true
          experimental: true
          cache: true
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISE_ENV: release
        run: mise tasks run release
